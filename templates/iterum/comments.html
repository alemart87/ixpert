{% extends "iterum/base_iterum.html" %}

{% block title %}Iterum · Comentarios{% endblock %}

{% block iterum_filters %}
<div class="iterum-filters" id="iterumFilters">
    <select id="filterCategory" class="iterum-filter">
        <option value="">Todos los tipos</option>
        <option value="detractor">Detractores</option>
        <option value="pasivo">Pasivos</option>
        <option value="promotor">Promotores</option>
    </select>
    <select id="filterChannel" class="iterum-filter"><option value="">Todos los canales</option></select>
    <select id="filterCell" class="iterum-filter"><option value="">Todas las células</option></select>
    <input type="text" id="filterSearch" class="iterum-filter iterum-filter-wide" placeholder="Buscar texto en comentario…">
    <input type="date" id="filterFrom" class="iterum-filter">
    <input type="date" id="filterTo" class="iterum-filter">
    <button id="filterApply" class="iterum-btn iterum-btn-primary">Aplicar</button>
    <button id="filterClear" class="iterum-btn iterum-btn-ghost">Limpiar</button>
</div>
{% endblock %}

{% block iterum_content %}
<h1 class="iterum-h1">Comentarios de clientes</h1>

<div id="commentsList" class="iterum-comments-list"></div>
<div class="iterum-pagination" id="commentsPagination"></div>
{% endblock %}

{% block iterum_scripts %}
<script src="{{ url_for('static', filename='iterum/js/iterum-comments.js') }}"></script>
{% endblock %}
