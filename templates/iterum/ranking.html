{% extends "iterum/base_iterum.html" %}

{% block title %}Iterum · Ranking{% endblock %}

{% block iterum_filters %}
<div class="iterum-filters" id="iterumFilters">
    <select id="filterChannel" class="iterum-filter"><option value="">Todos los canales</option></select>
    <select id="filterCell" class="iterum-filter"><option value="">Todas las células</option></select>
    <select id="filterSort" class="iterum-filter">
        <option value="nps">Ordenar por: NPS</option>
        <option value="promotores">Ordenar por: Promotores</option>
        <option value="detractores">Ordenar por: Detractores</option>
        <option value="resolucion">Ordenar por: Resolución</option>
        <option value="esfuerzo">Ordenar por: Esfuerzo (fácil)</option>
        <option value="total">Ordenar por: Cantidad</option>
    </select>
    <input type="date" id="filterFrom" class="iterum-filter">
    <input type="date" id="filterTo" class="iterum-filter">
    <button id="filterApply" class="iterum-btn iterum-btn-primary">Aplicar</button>
    <button id="filterClear" class="iterum-btn iterum-btn-ghost">Limpiar</button>
</div>
{% endblock %}

{% block iterum_content %}
<h1 class="iterum-h1">Ranking de asesores</h1>
<p class="iterum-meta" id="rankingMeta">Cargando…</p>

<div class="iterum-card iterum-rank-wrap">
    <div id="rankingList"></div>
</div>
{% endblock %}

{% block iterum_scripts %}
<script src="{{ url_for('static', filename='iterum/js/iterum-ranking.js') }}"></script>
{% endblock %}
