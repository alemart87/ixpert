{% extends "base.html" %}

{% block title %}Iterum · AI Analyst{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('static', filename='iterum/css/iterum-base.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='iterum/css/iterum-ai.css') }}">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('iterum-ai-mode');</script>
{% endblock %}

{% block content %}
<div class="ai-shell">
    <!-- Sidebar -->
    <div class="ai-sidebar">
        <div class="ai-brand">
            <div class="ai-brand-icon">iX</div>
            <div>
                <h2>AI Analyst</h2>
                <p>Iterum · GPT-5.4</p>
            </div>
        </div>
        <button id="aiNewChat" class="ai-btn ai-btn-primary ai-btn-block">+ Nueva conversación</button>
        <div class="ai-chats-list" id="aiChatsList"></div>
        <a href="{{ url_for('iterum.dashboard') }}" class="ai-back-link">← Volver al dashboard</a>
    </div>

    <!-- Chat central -->
    <section class="ai-chat-col">
        <header class="ai-chat-header">
            <h1 id="aiChatTitle">Seleccioná o creá una conversación</h1>
            <div class="ai-chat-meta">
                <span id="aiChatTokens" class="ai-meta-chip"></span>
                <button id="aiRenameChat" class="ai-btn ai-btn-ghost ai-btn-sm" title="Renombrar">Renombrar</button>
                <button id="aiArchiveChat" class="ai-btn ai-btn-ghost ai-btn-sm" title="Archivar">Archivar</button>
                <button id="aiToggleCanvas" class="ai-btn ai-btn-ghost ai-btn-sm" title="Mostrar/ocultar canvas">Canvas</button>
            </div>
        </header>

        <div class="ai-messages" id="aiMessages">
            <!-- El welcome con sugerencias lo renderiza renderWelcome() en JS
                 al cargar (o al abrir una conversacion vacia). -->
        </div>

        <div class="ai-input-area">
            <textarea id="aiInput" placeholder="Escribí tu pregunta… (Enter para enviar, Shift+Enter nueva línea)" rows="2"></textarea>
            <button id="aiSend" class="ai-btn ai-btn-primary" title="Enviar (Enter)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M2 21L23 12L2 3V10L17 12L2 14V21Z" fill="currentColor"/></svg>
            </button>
        </div>
    </section>

    <!-- Canvas / Workspace -->
    <aside class="ai-canvas-col" id="aiCanvasCol">
        <div class="ai-canvas-resizer" id="aiCanvasResizer" title="Arrastrar para redimensionar"></div>
        <header class="ai-canvas-header">
            <input type="text" id="aiCanvasTitle" class="ai-canvas-title-input" placeholder="Workspace">
            <span class="ai-canvas-version" id="aiCanvasVersion">v0</span>
            <button id="aiCanvasFullscreen" class="ai-btn ai-btn-ghost ai-btn-sm" title="Pantalla completa">⛶</button>
            <button id="aiCanvasSave" class="ai-btn ai-btn-primary ai-btn-sm">Guardar</button>
        </header>
        <div class="ai-canvas-tabs">
            <button class="ai-canvas-tab active" data-tab="preview">Vista</button>
            <button class="ai-canvas-tab" data-tab="editor">Editor</button>
            <button class="ai-canvas-tab" data-tab="split">Dividir</button>
        </div>
        <div class="ai-canvas-body">
            <textarea id="aiCanvas" class="ai-canvas-textarea ai-canvas-hidden-pane"
                placeholder="El AI Analyst va a escribir aquí planes de acción, listados, drafts, mapas mentales…&#10;&#10;Vos también podés editar manualmente."></textarea>
            <div id="aiCanvasPreview" class="ai-canvas-preview"></div>
        </div>
    </aside>
</div>

<!-- Mermaid para diagramas (mind maps, flowcharts, gantt) -->
<script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({
        startOnLoad: false,
        theme: 'base',
        // Paleta corporativa Itaú navy + gold. Mantiene legibilidad por default
        // y permite que el modelo aplique `style NODO fill:...` para acentos.
        themeVariables: {
            primaryColor: '#f8fafc',          // fondo de nodos default = slate claro
            primaryTextColor: '#0f172a',      // texto de nodos = slate-900
            primaryBorderColor: '#002776',    // borde nodos = navy
            secondaryColor: '#fef3c7',        // amarillo claro (segundo grupo)
            secondaryTextColor: '#7a5b00',
            secondaryBorderColor: '#c8a247',
            tertiaryColor: '#eff6ff',         // azul claro (tercer grupo)
            tertiaryTextColor: '#1e3a8a',
            tertiaryBorderColor: '#1e40af',
            mainBkg: '#f8fafc',
            nodeBkg: '#f8fafc',
            nodeTextColor: '#0f172a',
            lineColor: '#64748b',             // lineas = slate-500
            edgeLabelBackground: '#ffffff',
            background: '#ffffff',
            fontFamily: 'Inter, -apple-system, sans-serif',
            fontSize: '13px',
            // Mindmap especifico
            cScale0: '#002776', cScaleLabel0: '#ffffff',
            cScale1: '#c8a247', cScaleLabel1: '#1f1300',
            cScale2: '#1e40af', cScaleLabel2: '#ffffff',
            cScale3: '#dc2626', cScaleLabel3: '#ffffff',
            cScale4: '#16a34a', cScaleLabel4: '#ffffff',
            cScale5: '#d97706', cScaleLabel5: '#ffffff',
        },
        flowchart: { curve: 'basis', useMaxWidth: true, htmlLabels: true },
        mindmap: { useMaxWidth: true, padding: 20 },
        gantt: { useMaxWidth: true, fontFamily: 'Inter' },
    });
    window.IterumMermaid = mermaid;
    // Notificar al main script
    window.dispatchEvent(new Event('mermaid-ready'));
</script>
<script src="{{ url_for('static', filename='iterum/js/iterum-ai.js') }}"></script>
{% endblock %}
